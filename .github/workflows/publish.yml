name: Publish industrial packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish with --dry-run only
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'industrial-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Check industrial package versions and release tag
        env:
          PUBLISH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
        run: node scripts/check-industrial-release.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release gate
        run: bun run release:check
        env:
          PITANT_BENCH_PROFILE: ci

      - name: Registry smoke gate
        run: bun run registry:smoke

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'
        run: |
          npm publish ./packages/charts --dry-run --access public
          npm publish ./packages/charts-react --dry-run --access public

      - name: Publish with npm provenance
        if: github.event_name == 'release' || inputs.dry_run == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish ./packages/charts --provenance --access public
          npm publish ./packages/charts-react --provenance --access public
