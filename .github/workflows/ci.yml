name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test:coverage

      - name: Registry validate
        run: bun run registry:validate

      - name: Registry typecheck
        run: bun run registry:typecheck

      - name: Docs build
        run: bun run docs:build

      - name: Check bundle size
        run: bunx size-limit

      - name: Package dry run
        run: npm pack --dry-run ./packages/charts && npm pack --dry-run ./packages/charts-react

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @pitant/charts build
      - name: Run industrial benchmarks
        run: bun run bench
        env:
          PITANT_BENCH_PROFILE: ci

  browser-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        renderer: [canvas2d, webgpu]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build harness
        run: bun run harness:build

      - name: Browser pixel smoke
        run: bun run harness:verify -- --renderers=${{ matrix.renderer }}

      - name: Browser FPS smoke
        run: bun run harness:fps -- --renderers=${{ matrix.renderer }}

  cross-browser-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
            install-browser: chromium
          - os: ubuntu-latest
            browser: firefox
            install-browser: firefox
          - os: ubuntu-latest
            browser: webkit
            install-browser: webkit
          - os: windows-latest
            browser: edge
            install-browser: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        if: matrix.install-browser != ''
        run: bunx playwright install --with-deps ${{ matrix.install-browser }}

      - name: Build harness
        run: bun run harness:build

      - name: Cross-browser render smoke
        run: bun run harness:cross-browser -- --browser=${{ matrix.browser }} --renderer=canvas2d --profile=compact
