name: Chart catalog

on:
  push:
    branches: [main]
    paths:
      - 'apps/chart-catalog/**'
      - 'packages/charts-ui/package.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/chart-catalog.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/chart-catalog/**'
      - 'packages/charts-ui/package.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/chart-catalog.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - working-directory: apps/chart-catalog
        run: |
          node scripts/check-workspace.mjs
          bun run test
          bun run build
          node scripts/check-workspace.mjs --pack
