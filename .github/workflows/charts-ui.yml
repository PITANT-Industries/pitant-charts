name: Dashboard charts

on:
  push:
    paths:
      - 'packages/charts-ui/**'
      - '.github/workflows/charts-ui.yml'
      - 'bun.lock'
  pull_request:
    paths:
      - 'packages/charts-ui/**'
      - '.github/workflows/charts-ui.yml'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - working-directory: packages/charts-ui
        run: |
          bun run check
          bun run palette:check
          bun pm pack --quiet
          bun scripts/check-package.ts pitant-charts-*.tgz
